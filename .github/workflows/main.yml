name: ci

on:
  push:
    tags:
      - '*'
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Check out repo

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install, format check, lint, typecheck, test
        run: |
          bun install --frozen-lockfile
          bun run check

  create-release:
    permissions:
      contents: write
    needs: [lint-and-test]
    uses: nickatnight/gha-workflows/.github/workflows/create-release.yml@main
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
