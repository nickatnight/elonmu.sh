name: ci

on:
  push:
    # Render deploys a main commit only after its checks pass
    branches: [main]
    tags:
      - '*'
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Check out repo

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check, lint, typecheck
        run: bun run check:static

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Check out repo

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

  create-release:
    permissions:
      contents: write
    needs: [lint, test]
    uses: nickatnight/gha-workflows/.github/workflows/create-release.yml@main
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
